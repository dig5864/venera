name: Build & Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "平台选择"
        required: true
        type: choice
        default: "all"
        options:
          - all
          - android
          - ios
          - macos
          - windows
          - linux
          - linux-arm64
  release:
    types: [published]

env:
  APP_NAME: venera

jobs:
  # ============================================================
  # 公共：提取应用版本号
  # ============================================================
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      build_number: ${{ steps.version.outputs.BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from pubspec.yaml
        id: version
        run: |
          FULL_VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}')
          VERSION=$(echo $FULL_VERSION | cut -d'+' -f1)
          BUILD_NUMBER=$(echo $FULL_VERSION | cut -d'+' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Version: $VERSION (Build: $BUILD_NUMBER)"

  # ============================================================
  # Android APK 构建
  # ============================================================
  build-android:
    name: "Android APK"
    needs: get-version
    if: |
      github.event_name == 'release' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'android'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "oracle"
          java-version: "17"

      - name: Setup Rust toolchain
        run: rustup show

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: github.event_name == 'release'
        env:
          STORE_FILE: ${{ secrets.ANDROID_KEYSTORE }}
          PROPERTY_FILE: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$STORE_FILE" | base64 --decode > android/keystore.jks
          echo "$PROPERTY_FILE" > android/key.properties

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Rename artifacts
        run: |
          mkdir -p outputs
          for apk in build/app/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" | sed 's/app-//' | sed 's/-release.apk//')
            if [[ "$abi" == "release" ]]; then
              cp "$apk" "outputs/venera-${{ needs.get-version.outputs.version }}.apk"
            else
              cp "$apk" "outputs/venera-${{ needs.get-version.outputs.version }}-$abi.apk"
            fi
          done

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: outputs/
          retention-days: 90

  # ============================================================
  # iOS IPA 构建
  # ============================================================
  build-ios:
    name: "iOS IPA"
    needs: get-version
    if: |
      github.event_name == 'release' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'ios'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r venera-ios.ipa Payload

      - name: Prepare output
        run: |
          mkdir -p outputs
          mv build/ios/iphoneos/venera-ios.ipa \
             "outputs/venera-ios-${{ needs.get-version.outputs.version }}.ipa"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: outputs/
          retention-days: 90

  # ============================================================
  # macOS DMG 构建
  # ============================================================
  build-macos:
    name: "macOS DMG"
    needs: get-version
    if: |
      github.event_name == 'release' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'macos'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Install signing certificate
        if: github.event_name == 'release'
        env:
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE" | base64 --decode > signing_certificate.p12
          security import signing_certificate.p12 \
            -k ~/Library/Keychains/login.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

      - name: Check Rust toolchain
        run: rustup show

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Create DMG
        run: |
          mkdir -p dist/dmg_contents
          cp -R build/macos/Build/Products/Release/venera.app dist/dmg_contents/
          ln -s /Applications dist/dmg_contents/Applications
          hdiutil create -volname "venera" \
            -srcfolder dist/dmg_contents \
            -ov -format UDZO \
            dist/venera.dmg

      - name: Prepare output
        run: |
          mkdir -p outputs
          mv dist/venera.dmg "outputs/venera-${{ needs.get-version.outputs.version }}.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: outputs/
          retention-days: 90

  # ============================================================
  # Windows 构建
  # ============================================================
  build-windows:
    name: "Windows x64"
    needs: get-version
    if: |
      github.event_name == 'release' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install build tools
        run: |
          choco install yq -y --no-progress
          choco install innosetup --no-progress
          pip install httpx

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows (Inno Setup + ZIP)
        run: python windows/build.py

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/windows/Venera-*
          retention-days: 90

  # ============================================================
  # Linux x64 构建
  # ============================================================
  build-linux:
    name: "Linux x64"
    needs: get-version
    if: |
      github.event_name == 'release' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev webkit2gtk-4.1

      - name: Activate flutter_to_debian
        run: |
          dart pub global activate -s git https://github.com/venera-app/flutter_to_debian.git

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Linux (deb + Arch)
        run: |
          python3 debian/build.py x64
          dart run flutter_to_arch

      - name: Clean Arch build artifacts
        run: |
          sudo rm -rf build/linux/arch/app.tar.gz
          sudo rm -rf build/linux/arch/pkg
          sudo rm -rf build/linux/arch/src
          sudo rm -rf build/linux/arch/PKGBUILD

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: build/linux/x64/release/debian
          retention-days: 90

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: linux-arch
          path: build/linux/arch/
          retention-days: 90

  # ============================================================
  # Linux ARM64 构建
  # ============================================================
  build-linux-arm64:
    name: "Linux ARM64"
    needs: get-version
    if: |
      github.event_name == 'release' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'linux-arm64'
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev webkit2gtk-4.1

      - name: Activate flutter_to_debian
        run: |
          dart pub global activate -s git https://github.com/venera-app/flutter_to_debian.git

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Patch font for ARM64 CJK support
        run: dart run patch/font.dart

      - name: Build Linux ARM64 (deb)
        run: python3 debian/build.py arm64

      - name: Upload ARM64 Debian package
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-deb
          path: build/linux/x64/release/debian
          retention-days: 90

  # ============================================================
  # Release —— 汇总所有构建产物，发布到 GitHub Release
  # ============================================================
  release:
    name: "Publish Release"
    needs:
      [
        get-version,
        build-android,
        build-ios,
        build-macos,
        build-windows,
        build-linux,
        build-linux-arm64,
      ]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Create output directory
        run: mkdir -p outputs

      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: outputs/

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: outputs/

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: outputs/

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: outputs/

      - name: Download Linux deb
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: outputs/

      - name: Download Linux Arch
        uses: actions/download-artifact@v4
        with:
          name: linux-arch
          path: outputs/

      - name: Download Linux ARM64 deb
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-deb
          path: outputs/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "venera v${{ needs.get-version.outputs.version }}"
          files: |
            outputs/*.apk
            outputs/*.ipa
            outputs/*.dmg
            outputs/*.zip
            outputs/*.exe
            outputs/*.deb
            outputs/*.zst
            outputs/*.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_GITHUB_TOKEN }}

      - name: Generate release summary
        run: |
          echo "## Release v${{ needs.get-version.outputs.version }} :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Artifact |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|" >> $GITHUB_STEP_SUMMARY
          ls -1 outputs/ | while read file; do
            platform=$(echo "$file" | sed 's/venera-//' | sed 's/-.*//')
            echo "| $platform | $file |" >> $GITHUB_STEP_SUMMARY
          done
